{% extends "base.html" %}
{% block title %}Forgot Password | Bhuvi Fashions{% endblock %}
{% block content %}
<div class="login-box user-login"><div class="account-mark">BF</div><h1>Forgot Password?</h1>
<p>Enter the email address registered with your Bhuvi Fashions account.</p>
<form method="post">
<input name="email" type="email" placeholder="Email Address" autocomplete="email" required>
<button class="btn">SEND RESET LINK</button>
</form>
<p class="login-bottom"><a href="{{ url_for('login') }}">← Back to Login</a></p></div>
{% endblock %}
