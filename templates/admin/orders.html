{% extends "base.html" %}
{% block content %}
<section class="admin-head"><div><span>ORDER MANAGEMENT</span><h1>Orders</h1></div></section>
<div class="admin-table"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>
{% for o in orders %}<tr><td>#{{ o.id }}</td><td>{{ o.customer_name }}</td><td>{{ o.phone }}</td><td>₹{{ '%.0f'|format(o.total) }}</td><td><form method="post" action="{{ url_for('update_order_status', order_id=o.id) }}"><select name="status" onchange="this.form.submit()">{% for s in ['Pending','Confirmed','Shipped','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></form></td><td>{{ o.created_at }}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
