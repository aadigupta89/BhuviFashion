{% extends "base.html" %}
{% block title %}Reset Password | Bhuvi Fashions{% endblock %}
{% block content %}
<div class="login-box user-login"><div class="account-mark">🔐</div><h1>Reset Password</h1>
<p>Choose a new password for your account.</p>
<form method="post">
<input name="new_password" type="password" placeholder="New Password (minimum 8 characters)" minlength="8" autocomplete="new-password" required>
<input name="confirm_password" type="password" placeholder="Confirm New Password" minlength="8" autocomplete="new-password" required>
<button class="btn">RESET PASSWORD</button>
</form></div>
{% endblock %}
